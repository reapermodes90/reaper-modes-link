<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Get Your Link</title>
<style>
  :root{
    --bg:#0e1a17;
    --bg2:#122622;
    --card:#16302a;
    --line:#234d42;
    --text:#eaf5f0;
    --muted:#8fb3a8;
    --accent:#3ee08c;
    --accent-dim:#2a8f60;
    --warn:#ffb648;
    --done:#3ee08c;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f4faf7;
      --bg2:#ffffff;
      --card:#ffffff;
      --line:#d7ece3;
      --text:#0e2620;
      --muted:#5b7c72;
      --accent:#1c9a5b;
      --accent-dim:#e4f6ec;
      --warn:#c97a12;
      --done:#1c9a5b;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0e1a17; --bg2:#122622; --card:#16302a; --line:#234d42;
    --text:#eaf5f0; --muted:#8fb3a8; --accent:#3ee08c; --accent-dim:#2a8f60; --warn:#ffb648; --done:#3ee08c;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(circle at 15% 0%, rgba(62,224,140,0.12), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    display:flex;
    justify-content:center;
    padding:28px 16px 48px;
  }
  .wrap{
    width:100%;
    max-width:440px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:22px;
  }
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(145deg,var(--accent),var(--accent-dim));
    display:flex;align-items:center;justify-content:center;
    font-weight:700;color:#06251a;font-size:16px;
    flex:none;
    overflow:hidden;
  }
  .brand-mark img{
    width:100%;height:100%;object-fit:cover;
  }
  .brand-name{font-weight:700;font-size:15px;letter-spacing:.2px;}
  .brand-sub{font-size:11.5px;color:var(--muted);margin-top:1px;}

  .hero{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    overflow:hidden;
    margin-bottom:18px;
  }
  .hero-img{
    width:100%;
    aspect-ratio:16/9;
    object-fit:contain;
    display:block;
    background:
      radial-gradient(circle at 50% 35%, rgba(62,224,140,0.15), transparent 60%),
      linear-gradient(135deg,#050b17,#0c1b33);
    padding:14px 0;
  }
  .hero-body{padding:16px 18px 18px;}
  .hero-title{font-size:19px;font-weight:700;margin:0 0 4px;line-height:1.3;}
  .hero-meta{font-size:12.5px;color:var(--muted);}

  .progress-shell{
    display:flex;
    align-items:center;
    gap:10px;
    margin:18px 2px 14px;
  }
  .progress-track{
    flex:1;height:6px;border-radius:99px;
    background:var(--line);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--accent-dim),var(--accent));
    transition:width .35s ease;
  }
  .progress-count{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;}

  .steps{display:flex;flex-direction:column;gap:10px;}

  .step{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:13px 14px;
    cursor:pointer;
    transition:border-color .2s ease, transform .15s ease, opacity .2s ease;
    -webkit-tap-highlight-color:transparent;
    text-decoration:none;
    color:inherit;
  }
  .step:active{transform:scale(.985);}
  .step.locked{opacity:.55;cursor:default;}
  .step.locked:active{transform:none;}
  .step.done{border-color:var(--done);}

  .step-num{
    flex:none;
    width:30px;height:30px;
    border-radius:9px;
    background:var(--bg2);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;color:var(--muted);
  }
  .step.done .step-num{
    background:var(--done);
    border-color:var(--done);
    color:#06251a;
  }
  .step-body{flex:1;min-width:0;}
  .step-title{font-size:14.5px;font-weight:600;line-height:1.3;}
  .step-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .step-icon{flex:none;font-size:18px;opacity:.85;}
  .step.done .step-icon{color:var(--done);}

  .final{
    margin-top:4px;
    padding:15px 14px;
    border-radius:14px;
    background:var(--bg2);
    border:1px dashed var(--line);
    text-align:center;
    font-size:12.5px;
    color:var(--muted);
  }

  .get-link-btn{
    margin-top:12px;
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    font-size:15.5px;
    font-weight:700;
    cursor:pointer;
    background:var(--line);
    color:var(--muted);
    transition:background .25s ease, color .25s ease, transform .15s ease;
  }
  .get-link-btn.ready{
    background:linear-gradient(135deg,var(--accent),var(--accent-dim));
    color:#06251a;
  }
  .get-link-btn.ready:active{transform:scale(.98);}
  .get-link-btn:disabled{cursor:not-allowed;}

  .result{
    display:none;
    margin-top:14px;
    background:var(--card);
    border:1px solid var(--done);
    border-radius:14px;
    padding:16px;
    text-align:center;
  }
  .result.show{display:block;}
  .result-label{font-size:12px;color:var(--muted);margin-bottom:8px;}
  .result-link{
    display:block;
    word-break:break-all;
    font-size:13.5px;
    color:var(--accent);
    text-decoration:none;
    background:var(--bg2);
    border-radius:10px;
    padding:11px 12px;
    margin-bottom:10px;
  }
  .result-actions{display:flex;gap:8px;}
  .result-actions button{
    flex:1;
    padding:11px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--bg2);
    color:var(--text);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .result-actions button.primary{
    background:var(--accent);
    color:#06251a;
    border-color:var(--accent);
  }

  .footnote{
    text-align:center;
    font-size:11px;
    color:var(--muted);
    margin-top:20px;
    line-height:1.5;
  }
</style>
</head>

  <div class="brand">
    <div class="brand-mark"><img id="brandLogo" alt="Reaper Modes"></div>

      <div class="brand-name">Reaper Modes</div>

        <text x="350" y="150" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="54" fill="url(#goldGrad)" stroke="#3a2400" stroke-width="1.5" letter-spacing="2">VIP</text>

        <text x="350" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#eaf5f0" opacity="0.9" letter-spacing="4">UNLIMITED &#8226; UNLOCKED &#8226; UPGRADED</text>
      </svg>
    </div>
    <div class="hero-body">
      <p class="hero-title" id="gameTitle">Mode Menu Apks 2027</p>
      <p class="hero-meta" id="gameMeta">Latest Version · Android</p>
    </div>
  </div>

  <div class="progress-shell">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-count" id="progressCount">0/3</div>
  </div>

  <p style="font-size:16px;font-weight:700;color:var(--accent);margin:0 0 10px;">To get the link, Complete this steps</p>

  <div class="steps" id="steps"></div>

  <button class="get-link-btn" id="getLinkBtn" disabled>Complete the steps to get your link</button>

  <div class="result" id="result">
    <div class="result-label">Here's your link</div>
    <a class="result-link" id="resultLink" target="_blank" rel="noopener"></a>
    <div class="result-actions">
      <button id="copyBtn">Copy</button>
    </div>
  </div>

  <p class="footnote">Tapping a step opens a new tab for you to complete it.<br>Steps are remembered each time you return.</p>
  <p class="footnote"><a href="#" id="resetLink" style="color:var(--muted);text-decoration:underline;">Reset steps</a></p>
</div>

  steps: [
    { id: "sub1",    title: "Subscribe",         sub: "Subscribe on YouTube", icon: "▶️", url: "https://www.youtube.com/@ReaperModes7?sub_confirmation=1" },
    { id: "like",    title: "Like the Video",    sub: "Like the video",       icon: "👍", url: "https://youtu.be/zGwlgHJ2Az4" }
  ],

  finalUrl: "https://t.me/MASRY_GAMING22",
  waitSeconds: 15,
  storageKey: "frezy_unlock_v1"
};
/* ============================================================ */

document.getElementById("gameTitle").textContent = CONFIG.gameTitle;
document.getElementById("gameMeta").textContent = CONFIG.gameMeta;
document.getElementById("brandLogo").src = CONFIG.brandLogo;

let state = {};
try {
  state = JSON.parse(localStorage.getItem(CONFIG.storageKey) || "{}");
} catch(e) { state = {}; }

function saveState(){
  try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(state)); } catch(e){}
}

const stepsEl = document.getElementById("steps");
const getLinkBtn = document.getElementById("getLinkBtn");
const progressFill = document.getElementById("progressFill");
const progressCount = document.getElementById("progressCount");
const result = document.getElementById("result");
const resultLink = document.getElementById("resultLink");

let waitTimerHandle = null;

function render(){
  if (waitTimerHandle) { clearInterval(waitTimerHandle); waitTimerHandle = null; }
  stepsEl.innerHTML = "";
  let doneCount = 0;
  let waitingIdx = -1;
  let waitingRemaining = 0;

  CONFIG.steps.forEach((step, idx) => {
    const isDone = !!state[step.id];
    if (isDone) doneCount++;

    const prevDone = idx === 0 || !!state[CONFIG.steps[idx-1].id];
    let waitRemainingMs = 0;
    if (idx > 0 && prevDone) {
      const prevTime = state[CONFIG.steps[idx-1].id + "_time"] || 0;
      waitRemainingMs = (prevTime + CONFIG.waitSeconds * 1000) - Date.now();
    }
    const isWaiting = idx > 0 && prevDone && !isDone && waitRemainingMs > 0;
    const isLocked = (idx > 0 && !prevDone) || isWaiting;

    if (isWaiting && waitingIdx === -1) {
      waitingIdx = idx;
      waitingRemaining = Math.ceil(waitRemainingMs / 1000);
    }

    const el = document.createElement(isLocked || isDone ? "div" : "a");
    el.className = "step" + (isDone ? " done" : "") + (isLocked ? " locked" : "");
    if (!isLocked && !isDone){
      el.href = step.url;
      el.target = "_blank";
      el.rel = "noopener";
    }
    const subText = isDone
      ? "Completed"
      : (isWaiting ? `Wait ${Math.ceil(waitRemainingMs/1000)}s...` : step.sub);
    el.innerHTML = `
      <div class="step-num">${isDone ? "✓" : idx+1}</div>
      <div class="step-body">
        <div class="step-title">${step.title}</div>
        <div class="step-sub">${subText}</div>
      </div>
      <div class="step-icon">${step.icon}</div>
    `;
    if (!isLocked && !isDone){
      el.addEventListener("click", () => {
        state[step.id] = true;
        state[step.id + "_time"] = Date.now();
        saveState();
        setTimeout(render, 250);
      });
    }
    stepsEl.appendChild(el);
  });

  const total = CONFIG.steps.length;
  progressFill.style.width = (doneCount/total*100) + "%";
  progressCount.textContent = doneCount + "/" + total;

  const allDone = doneCount === total;
  let finalWaitRemainingMs = 0;
  if (allDone && total > 0) {
    const lastTime = state[CONFIG.steps[total-1].id + "_time"] || 0;
    finalWaitRemainingMs = (lastTime + CONFIG.waitSeconds * 1000) - Date.now();
  }
  const finalWaiting = allDone && finalWaitRemainingMs > 0;
  const ready = allDone && !finalWaiting;

  getLinkBtn.disabled = !ready;
  getLinkBtn.classList.toggle("ready", ready);
  if (ready) {
    getLinkBtn.textContent = "Get Your Link Now";
  } else if (finalWaiting) {
    getLinkBtn.textContent = `Wait ${Math.ceil(finalWaitRemainingMs/1000)}s...`;
  } else {
    getLinkBtn.textContent = `Complete the steps to get your link (${doneCount}/${total})`;
  }

  if (waitingIdx !== -1 || finalWaiting) {
    waitTimerHandle = setInterval(render, 1000);
  }
}

getLinkBtn.addEventListener("click", () => {
  if (getLinkBtn.disabled) return;
  resultLink.href = CONFIG.finalUrl;
  resultLink.textContent = CONFIG.finalUrl;
  result.classList.add("show");
  result.scrollIntoView({behavior:"smooth", block:"center"});
});

document.getElementById("copyBtn").addEventListener("click", async () => {
  const btn = document.getElementById("copyBtn");
  const old = btn.textContent;
  let copied = false;
  try {
    await navigator.clipboard.writeText(CONFIG.finalUrl);
    copied = true;
  } catch(e) {
    try {
      const ta = document.createElement("textarea");
      ta.value = CONFIG.finalUrl;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      copied = document.execCommand("copy");
      document.body.removeChild(ta);
    } catch(e2) { copied = false; }
  }
  btn.textContent = copied ? "Copied ✓" : "Tap link above to open";
  setTimeout(() => btn.textContent = old, 1800);
});

render();

document.getElementById("resetLink").addEventListener("click", (e) => {
  e.preventDefault();
  state = {};
  saveState();
  result.classList.remove("show");
  render();
});
</script>
